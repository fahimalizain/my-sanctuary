name = "my-sanctuary"
main = "build/index.js"
compatibility_date = "2026-05-02"

[observability]
enabled = true
head_sampling_rate = 1

[[routes]]
pattern = "my-sanctuary.fahimalizain.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "sanctuary-db"
database_id = "7fcdb90e-d286-412d-9161-a63e62ebaf44"

[build]
command = "PATH=\"$HOME/.cargo/bin:$PATH\" worker-build --release"

[assets]
directory = "../../dist/apps/web"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/health", "/version"]

[triggers]
crons = ["*/2 * * * *", "*/15 * * * *"]
