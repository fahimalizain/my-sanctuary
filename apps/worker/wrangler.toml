name = "my-sanctuary"
main = "build/index.js"
compatibility_date = "2026-05-02"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[routes]]
pattern = "my-sanctuary.fahimalizain.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "sanctuary-db"
database_id = "7fcdb90e-d286-412d-9161-a63e62ebaf44"

[build]
command = "PATH=\"$HOME/.cargo/bin:$PATH\" worker-build --release"

[assets]
directory = "../../dist/apps/web"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/health", "/version"]

[triggers]
crons = ["*/2 * * * *", "*/15 * * * *"]

[durable_objects]
bindings = [
  { name = "USER_HUB", class_name = "UserHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub"]

# calendar-sync is a latency layer (issue #80). Dirty generation + the
# 15-minute fallback cron remain the correctness contract.
# Local `wrangler dev` simulates this queue in-process — no
# `wrangler queues create` is required for local/dev. Do NOT run
# `wrangler queues create calendar-sync` or deploy this queue to
# production from this branch.
[[queues.producers]]
binding = "CALENDAR_SYNC"
queue = "calendar-sync"

[[queues.consumers]]
queue = "calendar-sync"
max_batch_size = 1
max_batch_timeout = 0
# max_retries left at the platform default (3).
# max_concurrency unset (autoscaling; per-calendar lease is the real cap).
# no dead-letter_queue — every meaningful failure Acks; cron recovers.
