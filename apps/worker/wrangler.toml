name = "my-sanctuary"
main = "build/index.js"
compatibility_date = "2026-05-02"

# Smart Placement: run the fetch handler near the D1 primary (Singapore)
# instead of the caller's colo (Chennai), so the Worker's D1 round trips are
# in-region. Static assets still serve from the edge (`[assets]`); only
# `run_worker_first` paths invoke the Worker. Cron / queue handlers are
# unaffected. Remove this block to go back to default placement.
[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[routes]]
pattern = "my-sanctuary.fahimalizain.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "sanctuary-db"
database_id = "7fcdb90e-d286-412d-9161-a63e62ebaf44"

# The OAuth 2.1 authorization server for the remote MCP endpoint is its own
# private Worker (`apps/auth`, no route): `/oauth/*` and
# `/.well-known/oauth-authorization-server*` are forwarded to it over this
# binding so discovery and endpoint URLs keep the public issuer origin, and
# `/mcp` validates bearer tokens through it. Deploy it first — this binding
# does not resolve until `my-sanctuary-auth` exists.
[[services]]
binding = "AUTH"
service = "my-sanctuary-auth"

[build]
command = "PATH=\"$HOME/.cargo/bin:$PATH\" worker-build --release"

[assets]
directory = "../../dist/apps/web"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/health", "/version", "/oauth/*", "/.well-known/*", "/mcp", "/mcp/*"]

[triggers]
crons = ["*/2 * * * *", "*/15 * * * *"]

[durable_objects]
bindings = [
  { name = "USER_HUB", class_name = "UserHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub"]

# calendar-sync is a latency layer (issue #80). Dirty generation + the
# 15-minute fallback cron remain the correctness contract.
# Local `wrangler dev` simulates this queue in-process — no
# `wrangler queues create` is required for local/dev. Do NOT run
# `wrangler queues create calendar-sync` or deploy this queue to
# production from this branch.
[[queues.producers]]
binding = "CALENDAR_SYNC"
queue = "calendar-sync"

[[queues.consumers]]
queue = "calendar-sync"
max_batch_size = 1
max_batch_timeout = 0
# max_retries left at the platform default (3).
# max_concurrency unset (autoscaling; per-calendar lease is the real cap).
# no dead-letter_queue — every meaningful failure Acks; cron recovers.
