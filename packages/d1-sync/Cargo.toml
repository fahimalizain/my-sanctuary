[package]
name = "d1-sync"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
api-core = { path = "../api-core" }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pollster = "0.4"
