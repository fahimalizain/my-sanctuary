name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx nx format:check --base="remotes/origin/master"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: cargo install worker-build --version 0.8.4

      - run: npx nx run-many -t build

  deploy:
    runs-on: ubuntu-latest
    needs: [format-check, lint, test, typecheck, build]
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: cargo install worker-build --version 0.8.4

      - run: npx nx build worker

      # Write env vars from GitHub Secrets into wrangler.toml
      # Note: wrangler.toml [vars] supports values; secrets go via wrangler secret put.
      # Since these are in GitHub Secrets, we inject them here instead of [vars].
      - run: |
          cat >> apps/worker/wrangler.toml << 'EOF'

          [vars]
          FRONTEND_URL = "${{ secrets.FRONTEND_URL }}"
          SECURE_COOKIE = "${{ secrets.SECURE_COOKIE }}"
          EOF

      # Apply D1 migrations before deploying the Worker
      - run: npx wrangler d1 migrations apply sanctuary-db --remote --cwd apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy first (required before secrets can be set)
      - run: npx nx deploy worker

      # Push secrets from GitHub Secrets to Cloudflare Worker
      - run: echo "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --cwd apps/worker
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - run: echo "$GOOGLE_CREDENTIALS_JSON" | npx wrangler secret put GOOGLE_CREDENTIALS_JSON --cwd apps/worker
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
